<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610">
<rect width="1100" height="610" fill="#f7f9fc"/><text x="36" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">Weather App — RA4M2 application / DA16200 network offload</text>
<rect x="40" y="82" width="680" height="470" rx="14" fill="#fff" stroke="#6c9bb8" stroke-width="2"/><text x="68" y="120" font-family="Arial" font-size="21" font-weight="bold" fill="#245b84">RA4M2 · FSP 6.6 · bare-metal scheduler</text>
<rect x="70" y="150" width="285" height="92" rx="10" fill="#e5f1fa" stroke="#8bb1ca"/><text x="92" y="184" font-family="Arial" font-size="17" font-weight="bold" fill="#245b84">weather_task state machine</text><text x="92" y="216" font-family="Arial" font-size="14" fill="#40596b">boot STA → connect → health poll → reconnect</text>
<rect x="385" y="150" width="290" height="92" rx="10" fill="#eaf6ed" stroke="#8ab496"/><text x="407" y="184" font-family="Arial" font-size="17" font-weight="bold" fill="#347344">AT engine + UART ring buffers</text><text x="407" y="216" font-family="Arial" font-size="14" fill="#40596b">SCI0 command/URC · SCI9 console</text>
<rect x="70" y="270" width="285" height="105" rx="10" fill="#fff3df" stroke="#d2a75e"/><text x="92" y="305" font-family="Arial" font-size="17" font-weight="bold" fill="#8b641d">Weather service</text><text x="92" y="337" font-family="Arial" font-size="14" fill="#40596b">NWHTC → HTTP split → JSON → OLED</text><text x="92" y="360" font-family="Arial" font-size="14" fill="#40596b">5 s WFSTA health poll; no idle redraw</text>
<rect x="385" y="270" width="290" height="105" rx="10" fill="#f1eafb" stroke="#a98cc5"/><text x="407" y="305" font-family="Arial" font-size="17" font-weight="bold" fill="#6d5687">RA Data Flash, 8 KB</text><text x="407" y="337" font-family="Arial" font-size="14" fill="#40596b">last 384 B · two 192 B slots</text><text x="407" y="360" font-family="Arial" font-size="14" fill="#40596b">sequence + CRC + readback</text>
<rect x="70" y="405" width="605" height="105" rx="10" fill="#f8ece8" stroke="#c69582"/><text x="92" y="440" font-family="Arial" font-size="17" font-weight="bold" fill="#8a4d36">Provisioning portal · TCP 8080</text><text x="92" y="472" font-family="Arial" font-size="14" fill="#40596b">SoftAP → RA HTTP GET/POST → HTTP 202 pending → STA → flash commit</text><text x="92" y="496" font-family="Arial" font-size="14" fill="#40596b">80 is DA16200 LWIP page; RA page is 192.168.1.100:8080</text>
<rect x="775" y="142" width="285" height="120" rx="14" fill="#eaf6ed" stroke="#78aa82" stroke-width="2"/><text x="805" y="183" font-family="Arial" font-size="21" font-weight="bold" fill="#347344">DA16200 AT firmware</text><text x="805" y="216" font-family="Arial" font-size="15" fill="#40596b">STA/AP · DHCP · TCP socket</text><text x="805" y="244" font-family="Arial" font-size="14" fill="#516879">SDK firmware unchanged</text>
<path d="M720 200 L770 200" stroke="#426d87" stroke-width="4"/><polygon points="770,200 755,191 755,209" fill="#426d87"/><text x="720" y="184" font-family="Arial" font-size="12" fill="#516879">SCI0 / AT</text>
<rect x="775" y="310" width="285" height="120" rx="14" fill="#e5f1fa" stroke="#6c9bb8" stroke-width="2"/><text x="805" y="351" font-family="Arial" font-size="20" font-weight="bold" fill="#245b84">Seniverse API</text><text x="805" y="384" font-family="Arial" font-size="15" fill="#40596b">now / daily JSON via NWHTC</text><text x="805" y="412" font-family="Arial" font-size="13" fill="#8a4d36">Production key: server proxy recommended</text>
<path d="M720 320 C750 320 750 370 770 370" fill="none" stroke="#426d87" stroke-width="4"/><polygon points="770,370 755,361 755,379" fill="#426d87"/><text x="719" y="298" font-family="Arial" font-size="12" fill="#516879">HTTP offload</text>
<text x="776" y="500" font-family="Arial" font-size="14" fill="#516879">Validation still pending:</text><text x="776" y="526" font-family="Arial" font-size="14" fill="#8a4d36">Data Flash power-loss / rollback / reconnect edge cases</text>
</svg>
