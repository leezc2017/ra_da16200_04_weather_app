<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="470" viewBox="0 0 1050 470">
<rect width="1050" height="470" fill="#f7f9fc"/><text x="36" y="45" font-family="Arial" font-size="25" font-weight="bold" fill="#17324d">RA4M2LED — FSP GPIO map and application loop</text>
<rect x="36" y="75" width="465" height="355" rx="12" fill="#fff" stroke="#b7c8d8"/><text x="62" y="115" font-family="Arial" font-size="20" font-weight="bold" fill="#245b84">FSP generated pin_data.c</text>
<text x="62" y="160" font-family="Consolas,monospace" font-size="16" fill="#243746">P002 → output, initial LOW</text><text x="62" y="198" font-family="Consolas,monospace" font-size="16" fill="#243746">P044 → output, initial LOW</text><text x="62" y="236" font-family="Consolas,monospace" font-size="16" fill="#243746">P045 → output, initial HIGH</text>
<text x="62" y="298" font-family="Arial" font-size="15" fill="#516879">R_IOPORT_Open() in BSP warm start</text><text x="62" y="328" font-family="Arial" font-size="15" fill="#516879">No RTOS; generated pin configuration</text>
<rect x="550" y="75" width="465" height="355" rx="12" fill="#fff" stroke="#b7c8d8"/><text x="576" y="115" font-family="Arial" font-size="20" font-weight="bold" fill="#245b84">src/hal_entry.c loop (simplified)</text>
<text x="576" y="161" font-family="Consolas,monospace" font-size="15" fill="#243746">PinWrite(P002, LOW);</text><text x="576" y="193" font-family="Consolas,monospace" font-size="15" fill="#243746">PinWrite(P044, LOW);</text><text x="576" y="225" font-family="Consolas,monospace" font-size="15" fill="#243746">PinWrite(P045, HIGH);</text><text x="576" y="257" font-family="Consolas,monospace" font-size="15" fill="#243746">Delay(500 ms);</text>
<path d="M770 290 L770 323 L650 323 L650 350 M770 323 L900 323 L900 350" fill="none" stroke="#5c91b5" stroke-width="3"/><circle cx="650" cy="374" r="22" fill="#8ac7a0"/><circle cx="770" cy="374" r="22" fill="#8ac7a0"/><circle cx="900" cy="374" r="22" fill="#8ac7a0"/><text x="625" y="420" font-family="Arial" font-size="13" fill="#516879">GPIO pattern repeats; validate polarity on board</text>
</svg>
